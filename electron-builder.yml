appId: br.com.benner.btoolkit
productName: BToolKit
copyright: Copyright © ${author}

directories:
  buildResources: resources
  output: dist

files:
  - out/**
  - package.json

publish:
  provider: github
  owner: mrcsmcl
  repo: BToolKit
  releaseType: draft

win:
  target: nsis
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  # oneClick: o instalador roda sem assistente. E o que permite a atualizacao
  # automatica nao mostrar nenhum "Avancar" ao usuario.
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
