appId: br.com.benner.btoolkit
productName: BToolKit
copyright: Copyright © ${author}

directories:
  buildResources: resources
  output: dist

files:
  - out/**
  - package.json

publish:
  provider: github
  owner: mrcsmcl
  repo: BToolKit
  releaseType: draft

win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
