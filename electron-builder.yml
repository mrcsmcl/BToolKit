appId: br.com.benner.btoolkit
productName: BToolKit
copyright: Copyright © ${author}

directories:
  buildResources: resources
  output: dist

files:
  - out/**
  - package.json

extraResources:
  - from: .generated/historico.json
    to: historico.json

publish:
  provider: github
  owner: mrcsmcl
  repo: BToolKit
  releaseType: draft

win:
  target: nsis
  # Nao existe certificado de code signing no projeto, entao o passo de
  # assinatura so baixava e extraia o pacote winCodeSign a toa — e era o que
  # impedia gerar o instalador em maquina sem Modo de Desenvolvedor. O resedit
  # continua gravando icone e metadados no executavel.
  signExecutable: false
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  # Assistido, para a primeira instalacao ter a cara do produto. A atualizacao
  # continua sem tela nenhuma porque o updater chama quitAndInstall com o flag
  # de silencio — ver src/main/updater.ts.
  oneClick: false
  perMachine: false
  # Sem escolha de pasta: so boas-vindas e conclusao, dois cliques.
  allowToChangeInstallationDirectory: false
  removeDefaultUninstallWelcomePage: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: ${productName}
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  installerHeader: installerHeader.bmp
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: uninstallerSidebar.bmp
